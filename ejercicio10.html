<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Temperatura | JS</title>
    <link rel="stylesheet" href="css/ejercicio10.css">
</head>
<body>

    <div class="contenedor-formulario">
        <h1>Conversor de Temperatura</h1>
        <p class="subtitulo">Ingresa los grados Celsius para realizar la conversión.</p>
        
        <form class="formulario" onsubmit="return false;">
            <div class="grupo-formulario">
                <label for="celsius">Grados Celsius (°C)</label>
                <input type="text" id="celsius" placeholder="Ej: 25">
            </div>

            <div class="grupo-formulario">
                <label for="fahrenheit">Grados Fahrenheit (°F)</label>
                <input type="text" id="fahrenheit" placeholder="Resultado" readonly>
            </div>

            <button type="button" class="boton-enviar" onclick="convertirTemperatura()">
                Convertir
            </button>
        </form>
    </div>

    <script src="js/ejercicio10.js"></script>

</body>
</html>
