<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 11 - Convertidor de Kilometros a millas </title>
        <link rel="stylesheet" href="css/ejercicio11.css">

</head>
<body>

   
    <div class="contenedor-formulario">
        <h1>Convertidor de Kilometros a millas </h1>
        <p class="subtitulo"> Ingresa los kilomentros para realizar la conversión</p>

<form class="formulario" onsubmit="return false;">
   
    <div class="grupo-formulario">
<label for="Kilometros">Kilometros (Km) </label>
<input type="number" id="Kilometros" name="kilometros" placeholder="Solo números positivos" min="1">

    </div>


<div class="grupo-formulario">
    <label for="millas"> Millas </label>
    <input type="text" id="millas" placeholder="Resultado" readonly>
</div>

<button type="button" class="boton-enviar" onclick="ConvertiraMillas()">
    CONVERTIR

</button>

</form>
    </div>

    <script src="js/ejercicio11.js"></script>
    
</body>
</html>
