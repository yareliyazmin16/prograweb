<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 15 - Control de Estudiantes</title>
    <link rel="stylesheet" href="css/ejercicio11.css">
</head>
<body>
    <div class="contenedor-formulario">
        <h1>Control de Estudiantes</h1>
        <p class="subtitulos">Registra a los alumnos</p>

        <form class="formulario" onsubmit="return false;">
            <div class="grupo-formulario">
                <label for="nombreEstudiante">Nombre del Estudiante</label>
                <input type="text" id="nombreEstudiante" placeholder="Ej. Ana">

                <label for="calificacionEstudiante" >Calificación</label>
                <input type="number" id="calificacionEstudiante" placeholder="Ej. 92" min="0" max="100">
            </div>

            <div class="grupo-fomulario">
            <button type="button" class="boton-enviar" onclick="agregarEstudiante()">
                AGREGAR ESTUDIANTE
            </button></div>


            <div class="grupo-formulario">
                <label for="promedio">Calificación Promedio</label>
                <input type="text" id="promedio" placeholder="El promedio" readonly>

                <label for="masAlta" >Calificación Más Alta</label>
                <input type="text" id="masAlta" placeholder="Estudiante con mayor nota" readonly>

                <label for="masBaja" >Calificación Más Baja</label>
                <input type="text" id="masBaja" placeholder="Estudiante con menor nota" readonly>
            </div> 

            <button type="button" class="boton-enviar" onclick="calcularPromedios()">
                CLICK PARA CALCULAR 
            </button>
        </form>
    </div>

    <script src="js/ejercicio15.js"></script>
</body>
</html>
