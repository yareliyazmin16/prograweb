<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora - Ejercicio 16</title>
    <link rel="stylesheet" href="css/ejercicio16.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

    <div class="contenedor-formulario">
        <h1>Calculadora Web</h1>
        <p class="subtitulo">Operaciones básicas con Funciones Flecha</p>

        <div class="grupo-formulario">
            <label for="numero1">Primer Número:</label>
            <input type="text" id="numero1" placeholder="Ingresa un número">
        </div>
        

        <div class="grupo-formulario">
            <label for="numero2">Segundo Número:</label>
            <input type="text" id="numero2" placeholder="Ingresa un número">
        </div>

        <div class="grid-botones">
            <button class="boton-operacion" data-op="suma">+</button>
            <button class="boton-operacion" data-op="resta">-</button>
            <button class="boton-operacion" data-op="multiplicacion">*</button>
            <button class="boton-operacion" data-op="division">/</button>
        </div>

        <div class="grupo-formulario">
            <label for="resultado">Resultado:</label>
            <input type="text" id="resultado" readonly>
        </div>
    </div>

    <script src="js/ejercicio16.js"></script>
</body>
</html>
